<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>language, given physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f6;
    --ink:#1c1a17;
  }
  html,body{ margin:0; min-height:100%; }
  body{
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; gap:5vh;
    font-family:"Archivo Black","Arial Black",sans-serif;
  }
  a.piece{
    color:var(--ink); text-decoration:none; text-align:center;
    font-size:clamp(28px,6vw,72px); line-height:1.05;
    transition:transform .18s ease, text-shadow .18s ease;
  }
  /* each title wears its own sketch's typography */
  a.piece.ete{
    font-family:"Archivo Black","Arial Black",sans-serif;
    text-transform:uppercase;
  }
  a.piece.med{
    font-family:ui-sans-serif,system-ui,"Helvetica Neue",sans-serif;
    font-weight:300; text-transform:lowercase; letter-spacing:.06em;
  }
  a.piece.twc{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-weight:400; text-transform:lowercase; letter-spacing:.14em;
    font-size:clamp(20px,3.8vw,46px);
  }
  a.piece.school{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic; text-transform:lowercase; letter-spacing:.02em;
    font-size:clamp(24px,4.5vw,54px);
  }
  /* hover: the flat word pops into a little extrusion — a wink at the sketches */
  a.piece:hover, a.piece:focus-visible{
    transform:translate(-3px,-6px);
    text-shadow:
      1px 1px 0 var(--ink), 2px 2px 0 var(--paper),
      3px 3px 0 var(--ink), 4px 4px 0 var(--paper),
      5px 5px 0 var(--ink);
    outline:none;
  }
  /* the dividers — strings stretched between the pieces;
     brushing plucks them into a wobble (string.js) */
  svg.string{
    width:min(560px, 74vw); height:64px; display:block;
    touch-action:none;
    overflow:visible;          /* big swings may draw outside the box — don't clip them */
  }
  svg.string polyline{
    fill:none; stroke:var(--ink); stroke-width:3;
    stroke-linecap:round; stroke-linejoin:round;
  }
</style>
</head>
<body>
<a class="piece ete" href="everything-everywhere/">every thing<br>every where</a>

<svg class="string" viewBox="0 0 600 64" aria-hidden="true">
  <polyline/>
</svg>

<a class="piece med" href="meditations/">meditations</a>

<svg class="string" viewBox="0 0 600 64" aria-hidden="true">
  <polyline/>
</svg>

<a class="piece twc" href="time-witness-clock/">time witness clock</a>

<svg class="string" viewBox="0 0 600 64" aria-hidden="true">
  <polyline/>
</svg>

<a class="piece school" href="liquid-words/">liquid words</a>

<script src="string.js"></script>
</body>
</html>
