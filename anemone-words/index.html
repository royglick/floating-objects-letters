<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anemone words</title>
<style>
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
  #stage{ display:block; touch-action:none; cursor:crosshair; }
  #back{
    position:fixed; top:14px; left:16px; z-index:10;
    font:20px ui-monospace,Menlo,Consolas,monospace; text-decoration:none;
    color:#fff; opacity:.4; transition:opacity .2s ease;
  }
  #back:hover{ opacity:1; }
  #textbox{
    position:fixed; top:16px; right:16px; z-index:10;
    width:min(220px, 50vw);
    font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;
    padding:8px 10px;
    color:#eee; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.35); border-radius:4px; outline:none;
    user-select:text; -webkit-user-select:text;
    resize:none; overflow-y:hidden;
    display:block;
  }
  #textbox:focus{ background:rgba(0,0,0,.85); border-color:rgba(255,255,255,.7); }
  #hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    font:12px ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em;
    color:#fff; opacity:.3; pointer-events:none; white-space:nowrap;
  }
  #knobs{
    position:fixed; right:16px; bottom:16px; z-index:10;
    font:11px ui-monospace,Menlo,Consolas,monospace;
    color:#eee; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.35); border-radius:4px;
    padding:8px 10px; display:grid; gap:4px;
    opacity:.7; transition:opacity .2s ease;
    user-select:none; cursor:grab; touch-action:none;
  }
  #knobs:hover{ opacity:1; background:rgba(0,0,0,.85); }
  #knobs .knob{
    display:grid; grid-template-columns:66px 92px 36px;
    align-items:center; gap:6px;
  }
  #knobs input[type=range]{ width:92px; accent-color:#fff; }
  #knobs .k-val{ text-align:right; }
</style>
</head>
<body>
<a id="back" href="../" title="back to menu">←</a>
<textarea id="textbox" rows="1" autocomplete="off" spellcheck="false" placeholder="type here…"></textarea>
<canvas id="stage"></canvas>
<div id="knobs">
  <div class="knob"><span>height</span>   <input id="knH" type="range" min="30"  max="400" step="5"   value="85"><span  class="k-val" id="kvH">85</span></div>
  <div class="knob"><span>thickness</span><input id="knR" type="range" min="0.1" max="1"   step="0.05" value="0.1"><span class="k-val" id="kvR">0.1</span></div>
  <div class="knob"><span>buoyancy</span> <input id="knB" type="range" min="40"  max="600" step="5"   value="220"><span class="k-val" id="kvB">220</span></div>
  <div class="knob"><span>drag</span>     <input id="knD" type="range" min="0.2" max="8"   step="0.1" value="2.6"><span class="k-val" id="kvD">2.6</span></div>
</div>
<p id="hint">brush to stir — press &amp; hold to gather — double-click to replant</p>

<script src="lib/strokefont.js"></script>
<script type="module" src="sketch.js"></script>
</body>
</html>
