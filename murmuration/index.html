<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>murmuration</title>
<style>
  :root{
    --paper:#faf9f6; --ink:#1c1a17;
    --dim:rgba(28,26,23,.58); --faint:rgba(28,26,23,.38);
    --panel:rgba(250,249,246,.74); --line:rgba(28,26,23,.16); --accent:#a97b3f;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--paper); }
  canvas#c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  #grain{ position:fixed; inset:0; z-index:3; pointer-events:none; }

  #back{
    position:fixed; top:14px; left:16px; z-index:10;
    font:16px var(--mono); text-decoration:none; color:var(--dim);
    opacity:.7; transition:opacity .2s;
  }
  #back:hover{ opacity:1; color:var(--ink); }

  #cap{
    position:fixed; left:16px; bottom:11px; z-index:10; pointer-events:none; user-select:none;
    font:10px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--faint);
  }

  /* ---- knobs ---- */
  #panel{ position:fixed; top:12px; right:14px; z-index:10;
    display:flex; flex-direction:column; align-items:flex-end; gap:8px; font-family:var(--mono); }
  #ptoggle{
    font:10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; cursor:pointer; backdrop-filter:blur(8px); transition:color .15s,border-color .15s;
  }
  #ptoggle:hover{ color:var(--ink); border-color:var(--accent); }
  #knobs{ display:none; }
  #panel.open #knobs{
    display:flex; flex-direction:column; gap:9px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px 11px; backdrop-filter:blur(10px);
  }
  .knob{ display:grid; grid-template-columns:76px 110px 44px; align-items:center; gap:9px; }
  .knob label{ font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .knob output{ font:11px var(--mono); color:var(--accent); text-align:right; font-variant-numeric:tabular-nums; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:3px;
    background:var(--line); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--ink); border:2px solid var(--paper); box-shadow:0 0 0 1px rgba(169,123,63,.55); }
  input[type=range]::-webkit-slider-thumb:hover{ box-shadow:0 0 0 1px var(--accent),0 0 8px rgba(169,123,63,.4); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%;
    background:var(--ink); border:2px solid var(--paper); box-shadow:0 0 0 1px rgba(169,123,63,.55); }
  input[type=range]:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

  #stat{ font:9.5px var(--mono); letter-spacing:.08em; color:var(--faint); text-align:right; padding-top:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<a id="back" href="../" title="back to menu">←</a>
<div id="cap">murmuration · drag to loose the falcon</div>

<div id="panel">
  <button id="ptoggle" type="button">knobs</button>
  <div id="knobs">
    <div class="knob"><label for="kb-birds">birds</label>
      <input type="range" id="kb-birds" data-k="birds" min="800" max="8000" step="100" value="3800"><output>3800</output></div>
    <div class="knob"><label for="kb-k" title="how many nearest neighbours each starling tracks — Ballerini et al. measured ~7">neighbours</label>
      <input type="range" id="kb-k" data-k="k" min="3" max="15" step="1" value="7"><output>7</output></div>
    <div class="knob"><label for="kb-coh">cohesion</label>
      <input type="range" id="kb-coh" data-k="coh" min="0.4" max="1.8" step="0.05" value="1"><output>1.00</output></div>
    <div class="knob"><label for="kb-tempo">tempo</label>
      <input type="range" id="kb-tempo" data-k="tempo" min="0.6" max="1.6" step="0.05" value="1"><output>1.00</output></div>
    <div id="stat"></div>
  </div>
</div>

<script src="sketch.js"></script>
</body>
</html>
